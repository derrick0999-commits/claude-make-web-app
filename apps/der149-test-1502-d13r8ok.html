<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>極簡 Hello World</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #17181b;
      --text: #f5f7fa;
      --muted: #a8b0bb;
      --line: #2a2d33;
      --accent: #7c9cff;
      --accent-2: #8ef0c8;
      --danger: #ff7b7b;
      --shadow: 0 0.5rem 1.5rem rgba(0,0,0,.24);
      --radius: 1rem;
    }

    * { box-sizing: border-box; }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(124,156,255,.14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(142,240,200,.1), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .page {
      min-height: 100dvh;
      padding:
        calc(env(safe-area-inset-top) + 1rem)
        1rem
        calc(env(safe-area-inset-bottom) + 1rem);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 42rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: rgba(23,24,27,.86);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      backdrop-filter: blur(.4rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 3rem);
      letter-spacing: .02em;
    }

    .sub {
      margin: .5rem 0 0;
      color: var(--muted);
      font-size: clamp(.95rem, 3.4vw, 1.05rem);
    }

    .hello {
      font-size: clamp(2rem, 10vw, 4.5rem);
      font-weight: 800;
      text-align: center;
      padding: 1rem 0;
      word-break: break-word;
    }

    .controls {
      display: grid;
      gap: .75rem;
    }

    label {
      display: block;
      font-size: .95rem;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: .85rem 1rem;
      border-radius: .85rem;
      border: 1px solid var(--line);
      background: #101114;
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(124,156,255,.15);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: .85rem;
      padding: .85rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .06s ease, opacity .2s ease, background .2s ease;
    }

    button:active {
      transform: translateY(.05rem) scale(.995);
    }

    .primary {
      background: var(--accent);
      color: white;
      flex: 1 1 12rem;
    }

    .secondary {
      background: #242832;
      color: var(--text);
      flex: 1 1 10rem;
    }

    .danger {
      background: rgba(255,123,123,.14);
      color: #ffd7d7;
      border: 1px solid rgba(255,123,123,.25);
      flex: 1 1 10rem;
    }

    .meta {
      color: var(--muted);
      font-size: .9rem;
    }

    .dot {
      display: inline-block;
      width: .6rem;
      height: .6rem;
      border-radius: 50%;
      background: var(--accent-2);
      margin-right: .45rem;
      vertical-align: middle;
      box-shadow: 0 0 .8rem rgba(142,240,200,.6);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="wrap">
      <div class="card">
        <h1>Hello World</h1>
        <p class="sub">極簡、可記住狀態的單頁。</p>
      </div>

      <div class="card">
        <div id="helloText" class="hello">Hello World</div>
        <div class="meta"><span class="dot"></span><span id="savedInfo">已自動儲存</span></div>
      </div>

      <div class="card controls">
        <div>
          <label for="messageInput">自訂文字</label>
          <input id="messageInput" type="text" placeholder="輸入想顯示的內容" maxlength="120" />
        </div>
        <div class="actions">
          <button id="applyBtn" class="primary" type="button">套用</button>
          <button id="defaultBtn" class="secondary" type="button">還原預設</button>
          <button id="resetBtn" class="danger" type="button">重設儲存狀態</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const KEY_PREFIX = location.pathname + '::';
      const STORAGE_KEY = KEY_PREFIX + 'minimal-hello-state';

      const els = {
        helloText: document.getElementById('helloText'),
        messageInput: document.getElementById('messageInput'),
        applyBtn: document.getElementById('applyBtn'),
        defaultBtn: document.getElementById('defaultBtn'),
        resetBtn: document.getElementById('resetBtn'),
        savedInfo: document.getElementById('savedInfo')
      };

      const defaultState = {
        message: 'Hello World',
        updatedAt: Date.now()
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...defaultState };
          const parsed = JSON.parse(raw);
          return {
            message: typeof parsed.message === 'string' && parsed.message.trim() ? parsed.message : defaultState.message,
            updatedAt: typeof parsed.updatedAt === 'number' ? parsed.updatedAt : Date.now()
          };
        } catch (_) {
          return { ...defaultState };
        }
      }

      function saveState(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
      }

      function formatTime(ts) {
        try {
          return new Date(ts).toLocaleString('zh-Hant', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        } catch (_) {
          return '';
        }
      }

      function render(state) {
        els.helloText.textContent = state.message;
        els.messageInput.value = state.message === defaultState.message ? '' : state.message;
        els.savedInfo.textContent = '已自動儲存 · ' + formatTime(state.updatedAt);
      }

      let state = loadState();
      render(state);

      function applyMessage(message) {
        const nextMessage = (message || '').trim() || defaultState.message;
        state = {
          message: nextMessage,
          updatedAt: Date.now()
        };
        saveState(state);
        render(state);
      }

      els.applyBtn.addEventListener('click', function () {
        applyMessage(els.messageInput.value);
      });

      els.messageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          applyMessage(els.messageInput.value);
        }
      });

      els.defaultBtn.addEventListener('click', function () {
        applyMessage(defaultState.message);
      });

      els.resetBtn.addEventListener('click', function () {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        state = { ...defaultState, updatedAt: Date.now() };
        render(state);
      });
    })();
  </script>
</body>
</html>
